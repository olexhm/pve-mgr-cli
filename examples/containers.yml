# LXC containers only. Uses examples/pve-mgr.yml.
# Containers have no guest agent; their address is read from the container itself.
devices:
  - type: lxc
    id: 4001
    name: dns1
    pool: infra
    template: lxc-debian13
    cores: 1
    memory_mb: 256
    bridges: [vmbr0]
    ansible_user: root

  - type: lxc
    id: 4002
    name: proxy1
    pool: infra
    template: lxc-debian13
    cores: 2
    memory_mb: 1024
    bridges: [vmbr0]
    ansible_user: root
    ssh_port: 2222
